<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinho na Mesa - Visualização de Entrevistas</title>
  <meta name="description" content="Assista às entrevistas completas com perguntas e respostas em sequência">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Ícones -->
  <link rel="icon" type="image/png" sizes="48x48" href="/img/logo_vinhonamesa.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/img/logo_vinhonamesa.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo_vinhonamesa.png">
  
  <!-- iOS Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinho na Mesa">
  <link rel="apple-touch-icon" href="/img/logo_vinhonamesa.png">
  
  <!-- Microsoft -->
  <meta name="msapplication-TileImage" content="/img/logo_vinhonamesa.png">
  <meta name="msapplication-TileColor" content="#5d1326">
  
  <style>
    :root {
      --bg: #0b0b0b;
      --wine: #5d1326;
      --gold: #c9a24a;
      --muted: #d9d9d9;
      --card: #121212;
      --radius: 12px;
    }
    
    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, Arial, sans-serif;
    }
    
    body {
      margin: 0;
      background: linear-gradient(0deg, #050505, #0b0b0b);
      color: var(--muted);
      min-height: 100vh;
      padding: 20px;
    }
    
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .logo img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(93, 19, 38, 0.3);
    }
    
    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--wine);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }
    
    .interviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .interview-card {
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s;
    }
    
    .interview-card:hover {
      transform: translateY(-5px);
      border-color: var(--wine);
    }
    
    .thumbnail {
      width: 100%;
      height: 160px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .interview-info {
      padding: 16px;
    }
    
    .interview-info h3 {
      margin: 0 0 8px 0;
      color: var(--gold);
    }
    
    .interview-meta {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #999;
      margin-top: 12px;
    }
    
    .btn {
      background: var(--wine);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    
    .btn:hover {
      background: #7a1a34;
    }
    
    .btn.gold {
      background: var(--gold);
      color: #000;
    }
    
    .btn.gold:hover {
      background: #d4b05f;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    
    .empty-state p {
      color: #777;
    }
    
    .ad-banner-space {
      background: rgba(40, 40, 40, 0.7);
      border: 1px dashed #5d1326;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-top: 10px;
      transition: all 0.3s ease;
      grid-column: 1 / -1;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .ad-banner-space:hover {
      border-color: #c9a24a;
      background: rgba(50, 50, 50, 0.8);
    }
    
    .ad-space {
      background: rgba(40, 40, 40, 0.7);
      border: 1px dashed #5d1326;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      color: #777;
      font-size: 14px;
      margin: 20px 0;
      transition: all 0.3s ease;
    }
    
    .ad-space:hover {
      border-color: #c9a24a;
      background: rgba(50, 50, 50, 0.8);
    }
    
    .ad-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 14px;
    }
    
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      
      .interviews-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="/img/logo_vinhonamesa.png" alt="Vinho na Mesa Logo">
        <h1>Vinho na Mesa</h1>
      </div>
    </header>
    
    <section class="card">
      <h2 style="color: var(--wine);">Entrevistas Públicas</h2>
      <p>Assista às entrevistas completas com perguntas e respostas em sequência.</p>
      
      <!-- Espaço para Anúncio -->
      <div class="ad-space" id="adViewer" style="height: 250px; margin: 20px 0;">
        <div class="ad-label">Patrocínio</div>
        <div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;text-align:center">
          📢<br/>Espaço disponível<br/>para anunciantes
        </div>
      </div>
      
      <div id="interviewsContainer">
        <div class="empty-state">
          <p>Carregando entrevistas...</p>
        </div>
      </div>
    </section>
    
    <footer>
      <p> 2025 Vinho na Mesa - Entrevistas Assíncronas</p>
      <p><a href="/">Voltar para a página inicial</a></p>
    </footer>
  </div>

  <script>
    async function loadInterviews() {
      const container = document.getElementById('interviewsContainer');
      container.innerHTML = `
        <div class="empty-state">
          <p>Carregando entrevistas...</p>
        </div>
      `;

      try {
        const res = await fetch('/api/interviews/public').then(r => r.json());
        const interviews = (res && res.ok && Array.isArray(res.data)) ? res.data : [];

        if (interviews.length > 0) {
          let html = '<div class="interviews-grid">';

          interviews.forEach((interview, index) => {
            const thumbHtml = interview.thumbnailUrl
              ? `<img src="${interview.thumbnailUrl}" alt="Capa">`
              : `<div>Capa não disponível</div>`;

            // Adicionar espaço para anúncio a cada 3 entrevistas
            if (index > 0 && index % 3 === 0) {
              html += `
                <div class="ad-banner-space">
                  <p>📺 Espaço para Anúncio</p>
                  <p style="font-size: 12px; margin-top: 5px;">300x250 - Banner Publicitário</p>
                </div>
              `;
            }

            html += `
              <div class="interview-card">
                <div class="thumbnail">${thumbHtml}</div>
                <div class="interview-info">
                  <h3>${interview.title || 'Entrevista Sem Título'}</h3>
                  <div>Entrevistador: ${interview.interviewerName || 'Anônimo'}</div>
                  <div>Artista: ${interview.artistName || 'Anônimo'}</div>
                  <div>Status: ${interview.status === 'published' ? '✅ Publicada' : '🎬 Em produção'}</div>
                  <div>Perguntas: ${interview.questionsCount || 0}</div>
                  <div>Respostas: ${interview.answersCount || 0}</div>
                  <div>Visualizações: ${interview.viewCount || 0}</div>
                  <div class="actions">
                    <a href="/viewer1.html?token=${interview.viewToken}" class="btn">
                      ${interview.status === 'published' ? '🎥 Assistir Entrevista' : '👀 Ver Perguntas'}
                    </a>
                  </div>
                </div>
              </div>
            `;
          });

          html += '</div>';
          container.innerHTML = html;
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <p>Nenhuma entrevista disponível no momento.</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Erro ao carregar entrevistas.</p>
          </div>
        `;
      }
    }

    // Carregar anúncios
    const adSlots = {
      'viewer': 'adViewer'
    };

    async function loadAds() {
      try {
        const res = await fetch('/api/ads');
        const data = await res.json();

        if (data.ok && data.data && data.data.length > 0) {
          data.data.forEach(ad => {
            const slotId = adSlots[ad.slot];
            if (slotId) {
              const slotEl = document.getElementById(slotId);
              if (slotEl) {
                slotEl.innerHTML = `
                  <div class="ad-label">${ad.title || 'Patrocínio'}</div>
                  ${ad.imageUrl ? `<img src="${ad.imageUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : 
                    `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px">${ad.title || 'Espaço para anúncio'}</div>`}
                `;
                if (ad.linkUrl) {
                  slotEl.style.cursor = 'pointer';
                  slotEl.onclick = () => window.open(ad.linkUrl, '_blank');
                }
              }
            }
          });
        } else {
          // Mostrar anúncios padrão se não houver no banco
          Object.values(adSlots).forEach(slotId => {
            const slotEl = document.getElementById(slotId);
            if (slotEl) {
              slotEl.innerHTML = `
                <div class="ad-label">Patrocínio</div>
                <div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;text-align:center">
                  📢<br/>Espaço disponível<br/>para anunciantes
                </div>
              `;
            }
          });
        }
      } catch (err) {
        console.error('Erro ao carregar anúncios:', err);
      }
    }

    // Carregar entrevistas quando a página carregar
    document.addEventListener('DOMContentLoaded', () => {
      loadInterviews();
      loadAds();
    });
    
    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('[SW] Service Worker registrado com sucesso:', registration.scope);
          })
          .catch(error => {
            console.log('[SW] Falha ao registrar Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
